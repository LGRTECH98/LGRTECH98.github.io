<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex + Blue Hearts</title>
<style>
  body{margin:0;min-height:100vh;background:#0e0e0e;display:flex;justify-content:center;align-items:center;overflow:hidden}
  #bg{position:fixed;inset:0;width:100%;height:100%;}
  .stage{
    width:420px;height:420px;background:#5a8df0;position:relative;overflow:hidden;
    border-radius:16px;box-shadow:0 0 60px rgba(90,141,240,.6);z-index:10;
  }
  .man{position:absolute;bottom:70px;left:-80px;width:50px;height:90px;transition:left 2.5s cubic-bezier(.4,0,.2,1),transform .4s;z-index:3}
  .man.in{left:185px}.man.bend{transform:translateY(15px) scaleY(.8)}
  .man .head{width:24px;height:24px;background:#ffdbac;border-radius:50%;margin:0 auto;position:relative}
  .man .head::after{content:'';position:absolute;top:-4px;left:2px;width:20px;height:12px;background:#f7d774;border-radius:50% 50% 0 0}
  .man .body{width:30px;height:38px;background:#7aa5ff;margin:2px auto 0;border-radius:6px 6px 0 0}
  .man .legs{display:flex;justify-content:center;gap:4px}.man .leg{width:10px;height:28px;background:#2c3e50}
  .box{position:absolute;bottom:72px;left:200px;width:18px;height:18px;background:#b7794c;border:2px solid #8a5a38;display:none;z-index:2}
  .box.show{display:block;animation:fall .5s ease}.box.grow{animation:grow .7s forwards}
  @keyframes fall{from{transform:translateY(-250px)}to{transform:translateY(0)}} 
  @keyframes grow{to{width:300px;height:260px;left:60px;bottom:85px;background:#fff;border:none;border-radius:12px}}
  .form{position:absolute;left:60px;bottom:85px;width:300px;height:260px;background:#fff;border-radius:12px;display:flex;flex-direction:column;padding:20px;box-sizing:border-box;gap:10px;transform:scale(0);opacity:0;transition:.6s cubic-bezier(.34,1.56,.64,1);z-index:10}
  .form.active{transform:scale(1);opacity:1}
  .form h2{margin:5px 0 0;text-align:center;font-size:18px;font-family:Arial}
  .form p{margin:0;text-align:center;font-size:11px;color:#777;font-family:Arial}
  .form input{padding:10px;border:1px solid #e5e5e5;border-radius:6px;outline:none;font-family:Arial}
  .form button{padding:11px;background:#000;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;margin-top:4px}
  .form button.blue{background:#2563eb}
  .small{font-size:11px;text-align:center;font-family:Arial;color:#555}.small span{color:#5a8df0;cursor:pointer}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="stage">
  <div class="man" id="man"><div class="head"></div><div class="body"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div>
  <div class="box" id="box"></div>
  <div class="form" id="login">
    <h2>Login</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button type="button" id="loginBtn">Login</button>
    <div class="small">Don't have an account? <span id="goReg">Sign up</span></div>
  </div>
  <div class="form" id="register">
    <h2>Register now</h2>
    <p>Please enter your details to continue</p>
    <input type="text" placeholder="Full Name">
    <input type="text" placeholder="Email Address">
    <input type="password" placeholder="Create password">
    <button type="button" class="blue" id="nextBtn">Next</button>
  </div>
</div>
